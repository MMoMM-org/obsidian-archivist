name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm test

            # Generate a cryptographic provenance attestation for the release
            # assets BEFORE semantic-release uploads them. The attestation is
            # stored on GitHub and lets users verify the artifacts were built
            # from this commit via `gh attestation verify`.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum scope for the GITHUB_TOKEN — every job in this workflow only
# needs to read the checked-out repo. Without this block, the token
# inherits the default broad scope (issues:write, contents:write, …)
# which CodeQL flags as missing-workflow-permissions.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  build:
    name: Build + bundle-size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify build/main.js exists
        run: test -f build/main.js
      - name: Verify bundle size < 1 MB
        run: |
          size=$(stat -c%s build/main.js 2>/dev/null || stat -f%z build/main.js)
          limit=1048576
          echo "build/main.js: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::build/main.js exceeds 1 MB bundle-size gate"
            exit 1
          fi

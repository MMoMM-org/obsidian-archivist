<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Archivist">
  <!--
    Dropbox app icon source. Brand-purple tile + Lucide `archive` (the same
    icon community.obsidian.md renders next to the plugin name, so users
    recognise it on the OAuth consent screen).

    Lucide path data from lucide-static v1.17.0 (ISC). Original viewBox is
    24×24 with stroke-width=2; here it's scaled by 6 and translated to
    centre on a 256-viewBox canvas, so the effective stroke is 12 device-
    units (~3 px at the 64×64 raster output, ~12 px at 256×256). Rendered
    to PNGs by assets/icons/render.sh.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B3FB8"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand tile. iOS-style corner radius (~22% of side). -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>

  <!-- Lucide `archive` (translate 56,56 + scale 6 ⇒ 144×144 icon, centred). -->
  <g transform="translate(56 56) scale(6)"
     fill="none"
     stroke="#FFFFFF"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <rect width="20" height="5" x="2" y="3" rx="1"/>
    <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
    <path d="M10 12h4"/>
  </g>
</svg>
